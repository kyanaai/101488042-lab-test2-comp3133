@if (characters.length === 0) {
  <p class="no-results">No characters found.</p>
} @else {
  <div class="grid">
    @for (character of characters; track character.id || character.name) {
      <mat-card class="card">
        <div class="image-box">
          <img
            [src]="character.image || 'assets/default-avatar.png'"
            [alt]="character.name"
            (error)="onImageError($event)"
          />
        </div>

        <mat-card-content>
          <h3>{{ character.name }}</h3>
          <p><strong>House:</strong> {{ character.house || 'Unknown' }}</p>
          <p><strong>Species:</strong> {{ character.species || 'Unknown' }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-raised-button color="primary" (click)="openDetails(character.id)">
            View Details
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
}
